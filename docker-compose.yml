services:
  db:
    image: postgres:17.9-alpine3.23
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_local
      POSTGRES_DB: deployments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d deployments"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://tracker:tracker_local@db:5432/deployments
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
